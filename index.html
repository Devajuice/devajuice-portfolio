<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Devajith | Developer Portfolio</title>

        <!-- SEO -->
        <meta
            name="description"
            content="Devajith — Student, Developer, and Data Analyst passionate about creating efficient solutions."
        />
        <meta
            name="keywords"
            content="Devajith, Developer, Portfolio, Web Development, Python, Data Analysis, Kerala"
        />
        <meta name="author" content="Devajith" />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="https://devajuice.vercel.app" />

        <!-- Open Graph -->
        <meta property="og:url" content="https://devajuice.vercel.app/">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Devajith — Portfolio">
        <meta property="og:description" content="Building cool things on the web.">
        <meta property="og:image" content="https://devajuice.vercel.app/og-image.png">
        
        <!-- Twitter Meta Tags -->
        <meta name="twitter:card" content="summary_large_image">
        <meta property="twitter:domain" content="devajuice.vercel.app">
        <meta property="twitter:url" content="https://devajuice.vercel.app/">
        <meta name="twitter:title" content="Devajith — Portfolio">
        <meta name="twitter:description" content="Building cool things on the web.">
        <meta name="twitter:image" content="https://devajuice.vercel.app/og-image.png">

        <!-- PWA -->
        <link rel="manifest" href="/manifest.json" />
        <meta
            name="theme-color"
            content="#3b82f6"
            media="(prefers-color-scheme: dark)"
        />
        <meta
            name="theme-color"
            content="#2563eb"
            media="(prefers-color-scheme: light)"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Devajith" />

        <!-- Preconnect -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
        <link rel="preconnect" href="https://ws.audioscrobbler.com" />

        <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!-- Google Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400;1,9..40,700&display=swap"
            rel="stylesheet"
        />

        <!-- Theme init — prevents flash -->
        <script>
            (function () {
                var t =
                    localStorage.getItem("theme") ||
                    (window.matchMedia("(prefers-color-scheme: dark)").matches
                        ? "dark"
                        : "light");
                document.documentElement.setAttribute("data-theme", t);
            })();
        </script>

        <style>
            :root {
                color-scheme: light dark;
            }
            html {
                background: #fff;
            }
            html[data-theme="dark"] {
                background: #0a0a0a;
            }
            body {
                margin: 0;
                font-family: "DM Sans", system-ui, sans-serif;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
